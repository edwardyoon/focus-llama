<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>200k context: vanilla vs focus-llama before and after buffer decoupling</title>
  <desc>One 200k-token prompt bar, then three KV buffers. Vanilla keeps all 200k cells filled. focus-llama before reserves 200k cells but fills about 30k. focus-llama after allocates 80k cells and offloads evicted text to a store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="680" height="372" rx="10" fill="#0d1117"/>

  <!-- header -->
  <text x="60" y="30" font-size="14" font-weight="600" fill="#e6edf3">-c 200000: the prompt vs the KV buffer</text>

  <!-- prompt -->
  <text x="60" y="62" font-size="12" fill="#9aa4b2">Prompt text (RAM), same in all three</text>
  <rect x="60" y="72" width="560" height="34" rx="4" fill="#21262d" stroke="#6e7681" stroke-width="0.75"/>
  <text x="340" y="89" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c9d1d9">200k tokens of text</text>

  <!-- A: vanilla -->
  <text x="60" y="136" font-size="12" fill="#9aa4b2">A. vanilla llama.cpp: 200k cells, all filled</text>
  <rect x="60" y="146" width="560" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <text x="340" y="163" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#d8ccff">all 200k tokens resident in KV</text>

  <!-- B: focus-llama before -->
  <text x="60" y="206" font-size="12" fill="#9aa4b2">B. focus-llama before: 200k cells reserved, ~30k used</text>
  <rect x="60" y="216" width="560" height="34" rx="4" fill="none" stroke="#6e7681" stroke-width="0.75" stroke-dasharray="4 4"/>
  <rect x="60" y="216" width="14" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <rect x="76" y="216" width="84" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <text x="118" y="233" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#d8ccff">hot 30k</text>
  <text x="390" y="233" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8b949e">allocated, mostly empty</text>

  <!-- C: focus-llama after -->
  <text x="60" y="276" font-size="12" fill="#9aa4b2">C. focus-llama after: 80k cells + offload store</text>
  <rect x="60" y="286" width="224" height="34" rx="4" fill="none" stroke="#6e7681" stroke-width="0.75" stroke-dasharray="4 4"/>
  <rect x="60" y="286" width="12" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <rect x="74" y="286" width="84" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <text x="116" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#d8ccff">hot 30k</text>
  <rect x="160" y="286" width="84" height="34" rx="4" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <text x="202" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#d8ccff">retain 30k</text>
  <rect x="246" y="286" width="38" height="34" rx="4" fill="#21262d" stroke="#6e7681" stroke-width="0.75"/>
  <text x="265" y="303" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8b949e">free</text>

  <!-- store -->
  <rect x="345" y="278" width="275" height="50" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="0.75"/>
  <text x="482" y="296" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#e6edf3">focus-memory store</text>
  <text x="482" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#9aa4b2">evict out, refill back, Σ skill.states</text>

  <!-- arrows -->
  <line x1="288" y1="296" x2="342" y2="296" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="342" y1="311" x2="288" y2="311" stroke="#9aa4b2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="60" y="344" width="12" height="12" rx="2" fill="#2d2766" stroke="#a78bfa" stroke-width="0.75"/>
  <text x="80" y="350" dominant-baseline="central" font-size="12" fill="#9aa4b2">resident in KV</text>
  <rect x="200" y="344" width="12" height="12" rx="2" fill="#21262d" stroke="#6e7681" stroke-width="0.75"/>
  <text x="220" y="350" dominant-baseline="central" font-size="12" fill="#9aa4b2">text only / not in KV</text>
</svg>
